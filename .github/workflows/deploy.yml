name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API tests
        run: dotnet test api/Marajeel.sln -c Release
      - name: Web install
        run: npm ci
        working-directory: web
      - name: Web tests
        run: npm test
        working-directory: web
      - name: Web build (type-check + bundle)
        run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Publish API
        run: dotnet publish api/Marajeel.Api -c Release -o api-publish
      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: api-publish
          include-hidden-files: true

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: api-publish
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web-dist
          api_location: api-publish
          skip_app_build: true
          skip_api_build: true
